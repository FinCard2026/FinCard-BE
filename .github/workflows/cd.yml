name: CD

on:
  workflow_run:
    workflows: [ "CI" ]
    branches: [ main ]
    types: [ completed ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@9b978f09f2587beff9c80449f57cb0f0612d3039 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,AI_SERVER_URL,DOCKERHUB_USERNAME,DOCKER_IMAGE_TAG
          script_stop: true
          script: |
            if [ ! -d ~/fincard ]; then
              git clone https://github.com/${{ github.repository }}.git ~/fincard
            fi
            git -C ~/fincard fetch origin
            git -C ~/fincard checkout --force ${{ github.event.workflow_run.head_sha }}

            printf "DB_URL=%s\n" "$DB_URL" > ~/fincard/.env
            printf "DB_USERNAME=%s\n" "$DB_USERNAME" >> ~/fincard/.env
            printf "DB_PASSWORD=%s\n" "$DB_PASSWORD" >> ~/fincard/.env
            printf "REDIS_HOST=redis\n" >> ~/fincard/.env
            printf "REDIS_PORT=6379\n" >> ~/fincard/.env
            printf "JWT_SECRET=%s\n" "$JWT_SECRET" >> ~/fincard/.env
            printf "AI_SERVER_URL=%s\n" "$AI_SERVER_URL" >> ~/fincard/.env
            printf "DOCKERHUB_USERNAME=%s\n" "$DOCKERHUB_USERNAME" >> ~/fincard/.env
            printf "DOCKER_IMAGE_TAG=%s\n" "$DOCKER_IMAGE_TAG" >> ~/fincard/.env
            chmod 600 ~/fincard/.env

            docker compose -f ~/fincard/docker-compose.yml pull
            docker compose -f ~/fincard/docker-compose.yml up -d --remove-orphans
            docker image prune -f
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AI_SERVER_URL: ${{ secrets.AI_SERVER_URL }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}